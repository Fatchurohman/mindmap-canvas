<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EmeraldFlow - Luxury Node & MindMap Studio</title>
  <style>
    :root {
      --bg-dark: #060907;
      --panel-bg: #0d1410;
      --card-bg: #121c16;
      --card-border: #1e3326;
      --emerald-primary: #00e676;
      --emerald-dark: #008f4c;
      --emerald-light: #69f0ae;
      --emerald-glow: rgba(0, 230, 118, 0.35);
      --gold-accent: #d4af37;
      --text-main: #f1f8f3;
      --text-muted: #7d9687;
      --danger: #ff5252;
      --radius: 10px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #a7f3d0 0%, #00e676 50%, #008f4c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--emerald-primary);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--emerald-primary);
      animation: emeraldPulse 1.8s infinite ease-in-out;
    }

    @keyframes emeraldPulse {
      0% {
        transform: scale(0.9);
        box-shadow: 0 0 2px var(--emerald-primary);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.3);
        box-shadow: 0 0 12px var(--emerald-primary), 0 0 4px #fff;
        opacity: 1;
      }
      100% {
        transform: scale(0.9);
        box-shadow: 0 0 2px var(--emerald-primary);
        opacity: 0.7;
      }
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(135deg, var(--emerald-primary), var(--emerald-dark));
      color: #040805;
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.7rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: #15221b;
      color: var(--emerald-light);
      border: 1px solid var(--card-border);
    }

    .btn-danger {
      background: rgba(255, 82, 82, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 82, 82, 0.3);
    }

    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-size: 24px 24px;
      background-image: radial-gradient(circle, #16291e 1.2px, transparent 1.2px);
      touch-action: none;
    }

    #renderSurface {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .mind-node {
      position: absolute;
      min-width: 140px;
      max-width: 240px;
      background: linear-gradient(180deg, #16241c 0%, var(--card-bg) 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      z-index: 20;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .mind-node:active {
      cursor: grabbing;
    }

    .mind-node.selected {
      border-color: var(--emerald-primary);
      box-shadow: 0 0 14px var(--emerald-glow);
    }

    .mind-node.connecting-source {
      border-color: var(--gold-accent);
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.5);
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 4px;
      pointer-events: auto;
    }

    .node-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--emerald-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: text;
      outline: none;
      padding: 2px 4px;
      border-radius: 3px;
      user-select: text;
    }

    .node-tag:focus {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--emerald-primary);
    }

    .node-tools {
      display: flex;
      gap: 4px;
    }

    .node-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .node-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .node-btn.delete-btn:hover {
      color: var(--danger);
    }

    .node-body {
      font-size: 0.85rem;
      color: var(--text-main);
      line-height: 1.35;
      outline: none;
      word-break: break-word;
      user-select: text;
      cursor: text;
      padding: 4px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      pointer-events: auto;
    }

    .floating-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(13, 20, 16, 0.85);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      z-index: 40;
      pointer-events: none;
    }

    .floating-hint strong {
      color: var(--emerald-light);
    }

    .file-wrapper {
      position: relative;
      display: inline-block;
    }

    .file-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <h1 class="brand-title">EmeraldFlow</h1>
      <div class="dev-badge">
        <span class="pulse-dot"></span>
        <span>developer : fatur62</span>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn" id="btnAddNode">+ Node Baru</button>
      <button class="btn btn-secondary" id="btnExportPNG">PNG</button>
      <button class="btn btn-secondary" id="btnExportJSON">Backup</button>
      <div class="file-wrapper">
        <button class="btn btn-secondary">Restore</button>
        <input type="file" id="importFileInput" accept=".json" />
      </div>
      <button class="btn btn-danger" id="btnClearCanvas" title="Reset Semua">✕</button>
    </div>
  </header>

  <main id="viewport">
    <canvas id="renderSurface"></canvas>
    <div class="floating-hint">
      Tag & Teks: <strong>Bisa diedit langsung</strong> | Hubungkan/Putus: <strong>Klik ⚡</strong>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "emeraldflow_v1_fatur62";
    let state = {
      nodes: [],
      connections: []
    };

    let activeConnectingSourceId = null;
    let draggedNodeId = null;
    let dragOffset = { x: 0, y: 0 };

    const viewport = document.getElementById("viewport");
    const canvas = document.getElementById("renderSurface");
    const ctx = canvas.getContext("2d");

    const resizeCanvas = () => {
      canvas.width = viewport.clientWidth;
      canvas.height = viewport.clientHeight;
      drawConnections();
    };

    window.addEventListener("resize", resizeCanvas);

    const escapeHTML = (str) => {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    };

    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          initDefaultData();
          return;
        }
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.nodes) && Array.isArray(parsed.connections)) {
          state = parsed;
        } else {
          initDefaultData();
        }
      } catch (err) {
        console.error("Gagal parse LocalStorage JSON:", err);
        initDefaultData();
      }
    };

    const saveState = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error("Penyimpanan lokal gagal:", err);
      }
    };

    const initDefaultData = () => {
      state = {
        nodes: [
          { id: "node_1", x: 40, y: 80, tag: "UTAMA", text: "Sistem Saraf Manusia" }
        ],
        connections: []
      };
      saveState();
    };

    const drawConnections = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      state.connections.forEach(conn => {
        const fromNode = state.nodes.find(n => n.id === conn.from);
        const toNode = state.nodes.find(n => n.id === conn.to);

        if (!fromNode || !toNode) return;

        const fromElem = document.getElementById(fromNode.id);
        const toElem = document.getElementById(toNode.id);

        if (!fromElem || !toElem) return;

        const startX = fromNode.x + fromElem.offsetWidth;
        const startY = fromNode.y + fromElem.offsetHeight / 2;
        const endX = toNode.x;
        const endY = toNode.y + toElem.offsetHeight / 2;

        const dx = Math.max(Math.abs(endX - startX) * 0.5, 40);

        const gradient = ctx.createLinearGradient(startX, startY, endX, endY);
        gradient.addColorStop(0, "#00e676");
        gradient.addColorStop(1, "#69f0ae");

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(startX + dx, startY, endX - dx, endY, endX, endY);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = "rgba(0, 230, 118, 0.4)";
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(endX, endY, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#69f0ae";
        ctx.fill();
      });
    };

    const getPointerPos = (e) => {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    };

    const handleDragStart = (e, node) => {
      if (e.target.closest(".node-btn") || e.target.classList.contains("node-body") || e.target.classList.contains("node-tag")) return;
      const pos = getPointerPos(e);
      draggedNodeId = node.id;
      dragOffset.x = pos.x - node.x;
      dragOffset.y = pos.y - node.y;

      const elem = document.getElementById(node.id);
      if (elem) elem.classList.add("selected");
    };

    const renderNodes = () => {
      const existingNodes = viewport.querySelectorAll(".mind-node");
      existingNodes.forEach(n => n.remove());

      state.nodes.forEach(node => {
        const nodeDiv = document.createElement("div");
        nodeDiv.className = "mind-node";
        nodeDiv.id = node.id;
        nodeDiv.style.left = `${node.x}px`;
        nodeDiv.style.top = `${node.y}px`;

        if (activeConnectingSourceId === node.id) {
          nodeDiv.classList.add("connecting-source");
        }

        nodeDiv.innerHTML = `
          <div class="node-header">
            <span class="node-tag" contenteditable="true" title="Klik untuk ubah nama tag">${escapeHTML(node.tag || "UTAMA")}</span>
            <div class="node-tools">
              <button class="node-btn connect-btn" title="Hubungkan/Putus Garis">⚡</button>
              <button class="node-btn delete-btn" title="Hapus Node">✕</button>
            </div>
          </div>
          <div class="node-body" contenteditable="true">${escapeHTML(node.text || "Ketik konsep...")}</div>
        `;

        nodeDiv.addEventListener("mousedown", (e) => handleDragStart(e, node));
        nodeDiv.addEventListener("touchstart", (e) => handleDragStart(e, node), { passive: false });

        // Simpan Edit Tag
        const tagElem = nodeDiv.querySelector(".node-tag");
        tagElem.addEventListener("blur", () => {
          node.tag = tagElem.innerText.trim().toUpperCase() || "CABANG";
          saveState();
        });

        // Simpan Edit Isi Teks
        const bodyElem = nodeDiv.querySelector(".node-body");
        bodyElem.addEventListener("blur", () => {
          node.text = bodyElem.innerText.trim() || "Catatan Kosong";
          saveState();
        });

        const connBtn = nodeDiv.querySelector(".connect-btn");
        connBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          handleConnectionToggle(node.id);
        });

        const deleteBtn = nodeDiv.querySelector(".delete-btn");
        deleteBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteNode(node.id);
        });

        viewport.appendChild(nodeDiv);
      });

      drawConnections();
    };

    const handleConnectionToggle = (nodeId) => {
      if (!activeConnectingSourceId) {
        activeConnectingSourceId = nodeId;
        renderNodes();
      } else if (activeConnectingSourceId === nodeId) {
        activeConnectingSourceId = null;
        renderNodes();
      } else {
        const source = activeConnectingSourceId;
        const target = nodeId;

        const existingIndex = state.connections.findIndex(
          c => (c.from === source && c.to === target) || (c.from === target && c.to === source)
        );

        if (existingIndex !== -1) {
          state.connections.splice(existingIndex, 1);
        } else {
          state.connections.push({
            id: `conn_${Date.now()}`,
            from: source,
            to: target
          });
        }

        saveState();
        activeConnectingSourceId = null;
        renderNodes();
      }
    };

    const deleteNode = (nodeId) => {
      state.nodes = state.nodes.filter(n => n.id !== nodeId);
      state.connections = state.connections.filter(c => c.from !== nodeId && c.to !== nodeId);
      if (activeConnectingSourceId === nodeId) activeConnectingSourceId = null;
      saveState();
      renderNodes();
    };

    // Node pertama = "UTAMA", node berikutnya = "CABANG"
    const createNewNode = (x = 60, y = 140) => {
      const isFirst = state.nodes.length === 0;
      const newNode = {
        id: `node_${Date.now()}`,
        x: Math.max(10, x),
        y: Math.max(10, y),
        tag: isFirst ? "UTAMA" : "CABANG",
        text: isFirst ? "Topik Utama" : "Ketik konsep baru..."
      };
      state.nodes.push(newNode);
      saveState();
      renderNodes();
    };

    const handlePointerMove = (e) => {
      if (!draggedNodeId) return;

      const node = state.nodes.find(n => n.id === draggedNodeId);
      if (!node) return;

      const pos = getPointerPos(e);
      node.x = Math.max(5, pos.x - dragOffset.x);
      node.y = Math.max(5, pos.y - dragOffset.y);

      const elem = document.getElementById(node.id);
      if (elem) {
        elem.style.left = `${node.x}px`;
        elem.style.top = `${node.y}px`;
      }

      drawConnections();
    };

    const handlePointerEnd = () => {
      if (draggedNodeId) {
        const elem = document.getElementById(draggedNodeId);
        if (elem) elem.classList.remove("selected");
        draggedNodeId = null;
        saveState();
      }
    };

    window.addEventListener("mousemove", handlePointerMove);
    window.addEventListener("touchmove", handlePointerMove, { passive: false });

    window.addEventListener("mouseup", handlePointerEnd);
    window.addEventListener("touchend", handlePointerEnd);

    document.getElementById("btnAddNode").addEventListener("click", () => createNewNode());

    document.getElementById("btnClearCanvas").addEventListener("click", () => {
      if (confirm("Hapus seluruh kartu dan diagram?")) {
        state = { nodes: [], connections: [] };
        saveState();
        renderNodes();
      }
    });

    document.getElementById("btnExportJSON").addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const anchor = document.createElement("a");
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `emeraldflow_backup_${Date.now()}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    });

    document.getElementById("importFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed && Array.isArray(parsed.nodes) && Array.isArray(parsed.connections)) {
            state = parsed;
            saveState();
            renderNodes();
            alert("Mindmap berhasil dipulihkan!");
          } else {
            alert("Format file JSON tidak valid.");
          }
        } catch (err) {
          alert("Gagal membaca file JSON.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    document.getElementById("btnExportPNG").addEventListener("click", () => {
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = viewport.clientWidth * 2;
      exportCanvas.height = viewport.clientHeight * 2;
      const expCtx = exportCanvas.getContext("2d");
      expCtx.scale(2, 2);

      expCtx.fillStyle = "#060907";
      expCtx.fillRect(0, 0, viewport.clientWidth, viewport.clientHeight);

      state.connections.forEach(conn => {
        const fromNode = state.nodes.find(n => n.id === conn.from);
        const toNode = state.nodes.find(n => n.id === conn.to);
        if (!fromNode || !toNode) return;

        const fromElem = document.getElementById(fromNode.id);
        const toElem = document.getElementById(toNode.id);
        if (!fromElem || !toElem) return;

        const startX = fromNode.x + fromElem.offsetWidth;
        const startY = fromNode.y + fromElem.offsetHeight / 2;
        const endX = toNode.x;
        const endY = toNode.y + toElem.offsetHeight / 2;
        const dx = Math.max(Math.abs(endX - startX) * 0.5, 40);

        expCtx.beginPath();
        expCtx.moveTo(startX, startY);
        expCtx.bezierCurveTo(startX + dx, startY, endX - dx, endY, endX, endY);
        expCtx.strokeStyle = "#00e676";
        expCtx.lineWidth = 2.5;
        expCtx.stroke();
      });

      state.nodes.forEach(node => {
        const elem = document.getElementById(node.id);
        if (!elem) return;

        const w = elem.offsetWidth;
        const h = elem.offsetHeight;

        expCtx.fillStyle = "#121c16";
        expCtx.strokeStyle = "#1e3326";
        expCtx.lineWidth = 1;
        expCtx.beginPath();
        expCtx.roundRect(node.x, node.y, w, h, 8);
        expCtx.fill();
        expCtx.stroke();

        expCtx.fillStyle = "#69f0ae";
        expCtx.font = "bold 10px sans-serif";
        expCtx.fillText((node.tag || "Node").toUpperCase(), node.x + 10, node.y + 16);

        expCtx.fillStyle = "#f1f8f3";
        expCtx.font = "12px sans-serif";
        expCtx.fillText(node.text || "", node.x + 10, node.y + 36);
      });

      const link = document.createElement("a");
      link.download = `emeraldflow_diagram_${Date.now()}.png`;
      link.href = exportCanvas.toDataURL("image/png");
      link.click();
    });

    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      resizeCanvas();
      renderNodes();
    });
  </script>
</body>
</html>
